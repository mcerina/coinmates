# Coinmates for Windows: the options of the Linux launcher (netplay/flatpak/launch), which follows
# EmuDeck. The ROMs are where EmuDeck keeps them, in the Emulation folder of the user; if it's
# elsewhere, e.g. on another drive, change the paths below. The settings stay next to coinmates.exe.
rompath                   "%USERPROFILE%\Emulation\roms\arcade;%USERPROFILE%\Emulation\bios;%USERPROFILE%\Emulation\bios\mame"
samplepath                "%USERPROFILE%\Emulation\storage\mame\samples"
artpath                   "%USERPROFILE%\Emulation\storage\mame\artwork"
cfg_directory             cfg
nvram_directory           nvram
netplay_logs              "%USERPROFILE%\Documents\Coinmates"
joystickprovider          sdljoy
joystick_deadzone         0.3
joystick_saturation       0.85
video                     opengl
samplerate                48000
