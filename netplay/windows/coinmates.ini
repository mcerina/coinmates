# Coinmates for Windows: the options EmuDeck for Windows sets for MAME (functions/EmuScripts/emuDeckMAME.ps1
# and configs/mame of github.com/EmuDeck/emudeck-we). The ROMs and saves are where EmuDeck keeps them,
# in the Emulation folder of the user; if it's elsewhere, e.g. on another drive, change the paths
# below. Not EmuDeck's, as on Linux (netplay/flatpak/launch): cheat, plugins and ini folders;
# writeconfig, which would write an ini for every game played; the room logs stay next to
# coinmates.exe with the settings (Documents may be in OneDrive, where nobody would look for them).
rompath                   "%USERPROFILE%\Emulation\roms\arcade;%USERPROFILE%\Emulation\bios;%USERPROFILE%\Emulation\bios\mame"
samplepath                "%USERPROFILE%\Emulation\storage\mame\samples"
artpath                   "%USERPROFILE%\Emulation\storage\mame\artwork"
ctrlrpath                 "%USERPROFILE%\Emulation\storage\mame\ctrlr"
nvram_directory           "%USERPROFILE%\Emulation\saves\mame\saves"
state_directory           "%USERPROFILE%\Emulation\saves\mame\states"
cfg_directory             cfg
netplay_logs              logs
joystickprovider          sdljoy
joystick_deadzone         0.3
joystick_saturation       0.85
video                     opengl
samplerate                48000
audio_latency             2
