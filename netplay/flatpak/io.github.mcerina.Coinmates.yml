# Coinmates: co-op arcade games with friends, online. Based on MAME.
# Built from the committed state of this repository by ../../../build-flatpak.sh
app-id: io.github.mcerina.Coinmates
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: launch
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all                       # controllers
  - --filesystem=home/Emulation:ro     # the ROMs, where EmuDeck keeps them
  - --filesystem=/run/media:ro         # or on an SD card
modules:
  # MAME draws its UI fonts with it, and the runtime doesn't have it
  - name: SDL2_ttf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2TTF_VENDORED=OFF
      - -DSDL2TTF_HARFBUZZ=OFF
      - -DSDL2TTF_SAMPLES=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-2.24.0.tar.gz
        sha256: 0b2bf1e7b6568adbdbc9bb924643f79d9dedafe061fa1ed687d1d9ac4e453bfd
  - name: mame
    buildsystem: simple
    build-options:
      strip: true
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS SUBTARGET=coinmates SOURCES=$(grep -v '^#' netplay/sources.txt | paste -sd,)
        USE_QTDEBUG=0 NO_USE_PORTAUDIO=1 NO_USE_PIPEWIRE=1 PRECOMPILE=0 NEW_GIT_VERSION=$(netplay/version.sh)
      - install -Dm755 coinmates /app/bin/coinmates
      - install -Dm755 netplay/flatpak/launch /app/bin/launch
      - install -Dm644 netplay/games.txt /app/share/coinmates/games.txt
      - install -Dm644 netplay/flatpak/default.cfg /app/share/coinmates/default.cfg
      # the entry in the menus, and in Steam's "Add a Non-Steam Game"
      - install -Dm644 netplay/flatpak/io.github.mcerina.Coinmates.desktop /app/share/applications/io.github.mcerina.Coinmates.desktop
      - install -Dm644 netplay/flatpak/io.github.mcerina.Coinmates.svg /app/share/icons/hicolor/scalable/apps/io.github.mcerina.Coinmates.svg
      # Steam shows only PNG icons
      - for s in 64 128 256; do install -d /app/share/icons/hicolor/${s}x${s}/apps;
        rsvg-convert -w $s -h $s netplay/flatpak/io.github.mcerina.Coinmates.svg -o /app/share/icons/hicolor/${s}x${s}/apps/io.github.mcerina.Coinmates.png; done
    sources:
      - type: git
        path: ../..
        branch: HEAD
